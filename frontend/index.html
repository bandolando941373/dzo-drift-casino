<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevents unwanted zooming and force-fits mobile Discord viewports -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <title>DriveZine Casino</title>

    <!-- Discord Embedded App SDK for Activities -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1/dist/index.min.js"></script>

    <!-- Tailwind CSS (via CDN fallback / default font styling) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Prevent scrolling, text selection, and touch highlight globally on mobile devices */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background-color: #022c22; /* Emerald 950 */
      }
    </style>
  </head>

    <!-- Vite Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
